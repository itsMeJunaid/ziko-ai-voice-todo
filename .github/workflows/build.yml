# Tests on every push; the Windows NSIS installer (the shipping target, PRD §8) on tags or by hand.
# PyInstaller can't cross-compile, so the backend sidecar is built on the Windows runner itself.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Backend lint + tests
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2
          uv sync
          uv run ruff check app tests
          uv run ruff format --check app tests
          uv run pytest -q
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend typecheck + tests
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  windows-installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1" # Windows consoles default to cp1252; keep Python output in UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Backend sidecar (PyInstaller)
        working-directory: backend
        run: |
          uv sync --extra windows
          uv run python scripts/build_sidecar.py
      - name: Desktop app + NSIS installer
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ziko-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
