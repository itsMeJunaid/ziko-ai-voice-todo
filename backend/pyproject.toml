[project]
name = "ziko-backend"
version = "0.1.3"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "keyring>=25.7.0",
    "livekit-wakeword>=0.3.0",
    "numpy>=2.5.4",
    "pvporcupine>=4.0.3",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "sounddevice>=0.5.6",
    "sqlalchemy>=2",
    "tzlocal>=5.4.5",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.optional-dependencies]
windows = [
    "winotify>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
